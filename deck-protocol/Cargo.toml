[package]
name = "deck-protocol"
version = "0.1.0"
description = "The messages between the footprints app and its Stream Deck plugin"
edition = "2021"
# The app builds against it too, so it needs no newer Rust than the app does.
rust-version = "1.82.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
